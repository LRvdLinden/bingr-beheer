# BingrBeheer: native app (iOS/iPadOS 17+, en via Mac Catalyst macOS 14+) voor het beheer-dashboard (https://beheer.bingr.online).
# Mac: hetzelfde target met SUPPORTS_MACCATALYST en dezelfde bundle-id (DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER = NO),
# zodat de Mac-versie via universal purchase bij dezelfde app in App Store Connect hoort; zie README.md, "Mac-app".
# Praat met dezelfde Edge Function `admin` als web/. Privé: nooit in de changelog en geen Bingr-buildnummer.
# Genereren: `xcodegen generate` in deze map (de workflow Beheer-app doet dat ook; het Xcode-project gaat versleuteld naar
# de map builds/ op de server van beheer.bingr.online, workflow Builds, en is op te halen via de tab Downloads).
name: BingrBeheer
options:
  bundleIdPrefix: nl.lrvdlinden
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "29"
    # Team van Léon van der Linden (zelfde als de Bingr-apps); automatisch ondertekenen
    DEVELOPMENT_TEAM: EU3UY476T6
    CODE_SIGN_STYLE: Automatic

targets:
  BingrBeheer:
    type: application
    platform: iOS
    sources:
      - path: BingrBeheer
      # gedeeld met de widgets (widget-token in de gedeelde Keychain-groep, deeplinks, widget-kinds)
      - path: Shared
    dependencies:
      # widget-extensie (wordt in de app ingebed: PlugIns/BingrBeheerWidgets.appex)
      - target: BingrBeheerWidgets
    entitlements:
      path: BingrBeheer/BingrBeheer.entitlements
      properties:
        # pushmeldingen (APNs, topic nl.lrvdlinden.bingr.beheer): development hier; bij archiveren/distribueren zet Xcode
        # dit op production. De Mac (Catalyst) heeft dezelfde capability in BingrBeheer-macOS.entitlements.
        aps-environment: development
        # eerst de eigen groep van de app (daar blijft het sessietoken), daarna de gedeelde groep voor het widget-token
        keychain-access-groups:
          - $(AppIdentifierPrefix)nl.lrvdlinden.bingr.beheer
          - $(AppIdentifierPrefix)nl.lrvdlinden.bingr.beheer.shared
    info:
      path: BingrBeheer/Info.plist
      properties:
        CFBundleDisplayName: BingrBeheer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl]
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: BingrBeheer gebruikt Face ID om de app te ontgrendelen.
        # Team-prefix voor de gedeelde Keychain-groep (WidgetTokenStore); leeg bij een build zonder ondertekening
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # bingrbeheer://support/1001 opent ticket #1001; bingrbeheer://support, ://status en ://overview openen die tab (widgets)
        CFBundleURLTypes:
          - CFBundleURLName: nl.lrvdlinden.bingr.beheer
            CFBundleURLSchemes: [bingrbeheer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr.beheer
        PRODUCT_NAME: BingrBeheer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        # Mac (Mac Catalyst, iPad-weergave): zelfde bundle-id als iOS (universal purchase), minimaal macOS 14 (= iOS 17)
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # macOS: sandbox, netwerk en dezelfde Keychain-groepen (vast bestand; iOS gebruikt het gegenereerde bestand hierboven)
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BingrBeheer/BingrBeheer-macOS.entitlements
        # de bouwstap hieronder schrijft in de app-bundel
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # ITMS-91109: de Xcode-zip komt uit een browserdownload, dus alle bestanden hebben com.apple.quarantine. Vlak vóór het
    # ondertekenen (Xcode ondertekent na de laatste bouwstap) alle uitgebreide kenmerken van de app (incl. PlugIns) wissen.
    postBuildScripts:
      - name: Quarantaine-kenmerken verwijderen
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          if [ -e "$APP" ]; then xattr -cr "$APP"; fi
    scheme: {}

  # Widgets (WidgetKit, iOS/iPadOS 17+ en macOS 14+ via Mac Catalyst): servicestatus, supporttickets en gecombineerd;
  # zie README.md, "Beheer-app: widgets". Op de Mac zonder de toegangsscherm-formaten (accessory*).
  # Gebruikt dezelfde publieke Config (AdminAPI.swift), JSON, Format en Theme als de app; geen geheimen.
  BingrBeheerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BingrBeheerWidgets
      - path: Shared
      - path: BingrBeheer/API/AdminAPI.swift
      - path: BingrBeheer/Core/JSON.swift
      - path: BingrBeheer/Core/Format.swift
      - path: BingrBeheer/Core/Theme.swift
    entitlements:
      path: BingrBeheerWidgets/BingrBeheerWidgets.entitlements
      properties:
        # alleen de gedeelde groep: de widget ziet het widget-token, niet het sessietoken van de app
        keychain-access-groups:
          - $(AppIdentifierPrefix)nl.lrvdlinden.bingr.beheer.shared
    info:
      path: BingrBeheerWidgets/Info.plist
      properties:
        CFBundleDisplayName: BingrBeheer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: nl
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr.beheer.widgets
        PRODUCT_NAME: BingrBeheerWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        # Mac Catalyst, net als de app (bundle-id blijft nl.lrvdlinden.bingr.beheer.widgets)
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BingrBeheerWidgets/BingrBeheerWidgets-macOS.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Quarantaine-kenmerken verwijderen
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          APPEX="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          if [ -e "$APPEX" ]; then xattr -cr "$APPEX"; fi
