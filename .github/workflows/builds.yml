name: Builds

# Zet de buildpakketten van Bingr (APK, App Bundle .aab voor Google Play, Samsung TV .wgt, Windows-installer .exe, Xcode-projecten) in de afgesloten map builds/ op de server van
# beheer.bingr.online. Ze staan nooit onversleuteld op GitHub: de workflows van iptv-ios-appletv, bingr-android en bingr-windows leveren
# ze versleuteld aan op de branch inbox-<platform> van de PRIVÉ repo LRvdLinden/bingr-inbox, de Beheer-app op inbox-beheer
# van deze repo (tools/seal_build.sh). Deze workflow haalt ze op (inbox-repo met secret BINGR_INBOX_READ_TOKEN; branches
# in deze repo zelf ook, voor de Beheer-app en de overgang), ontsleutelt ze met de privésleutel die alleen op de server
# staat, zet ze daar neer, werkt builds/manifest.json bij en verwijdert de branch.
# H3: de aanleverende repo's hebben geen schrijftoken meer op deze openbare repo (BINGR_BEHEER_TOKEN is vervallen).
# Downloaden kan alleen via het beheer (functie admin -> kortgeldige link naar dl.php).
# Sleutels: bij de eerste run (of met "Sleutels opnieuw maken") maakt deze workflow een sleutel voor de downloadlinks
# (builds/key.php en het function-secret BINGR_BUILDS_KEY) en een RSA-sleutelpaar (privé: builds/private.pem op de
# server; publiek: builds.pub.pem in deze repo).
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, optioneel FTP_USERNAME_ALT en FTP_DIR (zoals Dashboard),
# SUPABASE_ACCESS_TOKEN en optioneel SUPABASE_PROJECT_REF (zoals Admin-functie), BINGR_INBOX_READ_TOKEN (fine-grained,
# alleen LRvdLinden/bingr-inbox, Contents: Read and write) en optioneel de variabele BINGR_INBOX_REPO.
# Releasemelding (pushmelding): niet hier, maar per build met de hand vanuit het beheer (tab Downloads), want de stores
# keuren een build soms pas na dagen goed.
# Het log is openbaar: alleen platform, build en gelukt/mislukt.

on:
  repository_dispatch:
    types: [builds]
  workflow_dispatch:
    inputs:
      rotate:
        description: 'Sleutels opnieuw maken (oude downloadlinks en nog niet verwerkte pakketten vervallen)'
        type: boolean
        default: false
      import_repo:
        description: 'Pakketten uit versions/ van deze repo overzetten (eenmalig)'
        type: boolean
        default: false
  # de inbox-repo kan deze workflow niet starten (het inbox-token heeft geen rechten hier): elke 15 minuten kijken;
  # goedkoop, want zonder aangeleverde pakketten stopt hij na één ls-remote
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: builds
  cancel-in-progress: false

jobs:
  builds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_USERNAME_ALT: ${{ secrets.FTP_USERNAME_ALT }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_SECRET: ${{ secrets.SUPABASE_PROJECT_REF }}
      REF_DEFAULT: vjewsncmsxmhmhnoxwqx
      ROTATE: ${{ inputs.rotate || 'false' }}
      IMPORT_REPO: ${{ inputs.import_repo || 'false' }}
      INBOX_REPO: ${{ vars.BINGR_INBOX_REPO || 'LRvdLinden/bingr-inbox' }}
      INBOX_TOKEN: ${{ secrets.BINGR_INBOX_READ_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Iets te doen?
        id: todo
        run: |
          source tools/builds_process.sh
          # eerst hier (niet binnen $(...)), zodat ::add-mask:: in het log komt en niet in de uitvoer van de stap
          inbox_ready || true
          n=$(builds_pending)
          echo "inbox=$n" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = schedule ] && [ "$n" = 0 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Niets aangeleverd."; fi

      - name: lftp installeren
        if: steps.todo.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1 (v1.7.3)
        if: steps.todo.outputs.skip != '1'
        with:
          version: 2.121.0

      - name: Pakketten naar de server
        if: steps.todo.outputs.skip != '1'
        run: |
          set -euo pipefail
          REF="${REF_SECRET:-$REF_DEFAULT}"
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN ontbreekt."; exit 1; }
          source tools/ftps.sh
          source tools/builds_process.sh
          ftps_connect
          builds_init
          # downloadsleutel als function-secret (elke run, zodat server en functie altijd gelijk zijn)
          supabase secrets set --project-ref "$REF" "BINGR_BUILDS_KEY=$BUILDS_KEY" >/dev/null 2>&1 \
            && echo "::notice::Function-secret BINGR_BUILDS_KEY gezet." || { echo "::error::BINGR_BUILDS_KEY niet gezet."; exit 1; }
          # publieke sleutel in de repo (de workflows die pakketten aanleveren versleutelen daarmee)
          if ! cmp -s "$BW/pub.pem" builds.pub.pem; then
            cp "$BW/pub.pem" builds.pub.pem
            git config user.name github-actions; git config user.email actions@github.com
            git add builds.pub.pem && git commit -qm "Builds: publieke sleutel voor het aanleveren van pakketten"
            for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
            echo "::notice::builds.pub.pem bijgewerkt."
          fi
          [ "$IMPORT_REPO" = true ] && builds_import_repo
          builds_inbox
          # nieuwste Android-APK volgens het manifest (openbare gegevens: build, grootte, sha256) voor de controle hieronder
          python3 - "$BW/srv/manifest.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          a = (json.load(open(sys.argv[1])).get("platforms", {}) or {}).get("android") or {}
          print(f"APK_BUILD={a.get('build', '')}"); print(f"APK_SIZE={a.get('size', '')}"); print(f"APK_SHA={a.get('sha256', '')}")
          PY
          builds_finish

      - name: Controleren
        if: steps.todo.outputs.skip != '1'
        run: |
          set -uo pipefail
          url=https://beheer.bingr.online/
          ping=$(curl -s --max-time 20 "${url}dl.php?ping=1" || true)
          if echo "$ping" | grep -q '"ready":true'; then echo "::notice::dl.php is klaar voor downloads."
          else
            # sommige servers draaien PHP als een andere gebruiker: dan mogen key.php en manifest.json 644 zijn
            # (de map builds/ blijft via de webserver dicht)
            source tools/ftps.sh; ftps_connect >/dev/null
            ftps_try "chmod 644 \"$FTPS_TARGET/builds/key.php\" \"$FTPS_TARGET/builds/manifest.json\"" >/dev/null 2>&1
            ping=$(curl -s --max-time 20 "${url}dl.php?ping=1" || true)
            echo "$ping" | grep -q '"ready":true' && echo "::notice::dl.php is klaar (rechten 644)." || { echo "::error::dl.php kan de sleutel niet lezen."; exit 1; }
          fi
          # teller van de openbare Windows-installer (dl.php ?app=windows) moet schrijfbaar zijn voor PHP; zo niet, ruimere rechten (alleen dit bestand)
          for mode in 600 660 666; do
            ping=$(curl -s --max-time 20 "${url}dl.php?ping=1" || true)
            echo "$ping" | grep -q '"winstats":true' && { echo "::notice::Downloadteller Windows is schrijfbaar."; break; }
            [ "$mode" = 600 ] && continue
            [ -n "${FTPS_USER:-}" ] || { source tools/ftps.sh; ftps_connect >/dev/null; }
            ftps_try "chmod $mode \"$FTPS_TARGET/builds/windows-stats.json\"" >/dev/null 2>&1
          done
          echo "$ping" | grep -q '"winstats":true' || echo "::warning::Downloadteller Windows (builds/windows-stats.json) is niet schrijfbaar voor PHP; downloads worden niet geteld."
          for f in builds/ builds/manifest.json builds/key.php builds/private.pem builds/windows-stats.json builds/android/ builds/android-aab/ builds/apple/ builds/tizen/ builds/windows/; do
            c=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "${url}$f" || true)
            [ "$c" = 200 ] && { echo "::error::${url}$f is rechtstreeks bereikbaar"; exit 1; }
          done
          echo "::notice::Map builds/ is niet rechtstreeks bereikbaar."

      # Build 141: is de openbare testversie (dl.php?app=android, ook bingr.online/apk) het echte APK-bestand? Een geldige
      # APK (zip), gelijk aan het manifest (grootte, sha256), ondertekend met de Bingr-releasesleutel (openbare vingerafdruk)
      # en met de versionCode van de nieuwste build. Alleen ja/nee, grootte, versie en vingerafdruk in het log.
      - name: Openbare Android-APK controleren
        if: steps.todo.outputs.skip != '1' && env.APK_BUILD != ''
        env:
          WANT_CERT: "9E:D5:B7:30:C7:A4:B4:57:B8:0E:F9:91:A4:C6:FA:46:9C:9B:29:28:5B:9B:39:08:A8:93:6D:57:D0:C5:53:6B"
        run: |
          set -uo pipefail
          d=$(mktemp -d)
          code=$(curl -s --max-time 300 -D "$d/h" -o "$d/a.apk" -w '%{http_code}' "https://beheer.bingr.online/dl.php?app=android" || true)
          ct=$(grep -i '^content-type:' "$d/h" | tail -1 | cut -d: -f2- | tr -d ' \r')
          size=$(stat -c %s "$d/a.apk" 2>/dev/null || echo 0)
          sha=$(sha256sum "$d/a.apk" | cut -d' ' -f1)
          magic=$(head -c 4 "$d/a.apk" | od -An -tx1 | tr -d ' \n')
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          cert=$("$BT/apksigner" verify --print-certs "$d/a.apk" 2>/dev/null | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          vc=$("$BT/aapt2" dump badging "$d/a.apk" 2>/dev/null | grep -m1 '^package:' | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+')
          rm -rf "$d"
          e=""
          [ "$code" = 200 ] || e="$e HTTP $code;"
          [ "$ct" = application/vnd.android.package-archive ] || e="$e Content-Type $ct;"
          [ "$magic" = 504b0304 ] || e="$e geen APK (zip);"
          [ "$size" = "$APK_SIZE" ] || e="$e grootte $size i.p.v. $APK_SIZE;"
          [ "$sha" = "$APK_SHA" ] || e="$e sha256 wijkt af van het manifest;"
          [ "$cert" = "$WANT_CERT" ] || e="$e certificaat ${cert:-geen/ongeldige handtekening};"
          [ "$vc" = "$APK_BUILD" ] || e="$e versionCode ${vc:-?} i.p.v. $APK_BUILD;"
          if [ -n "$e" ]; then echo "::error title=Openbare APK::build $APK_BUILD niet in orde:$e"; exit 1; fi
          echo "::notice title=Openbare APK::build $APK_BUILD in orde: $size bytes, gelijk aan het manifest, versionCode $vc, ondertekend met de Bingr-releasesleutel ($cert)"
