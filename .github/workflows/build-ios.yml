name: Beheer-app

# Bouwt de native app Bingr Beheer (ios/, iOS/iPadOS 17+, XcodeGen) voor een generiek iOS-apparaat zonder ondertekening.
# Lukt dat, dan gaat het Xcode-project (ios/ met het gegenereerde .xcodeproj) als Bingr-Beheer-<versie>-build<N>-Xcode.zip
# versleuteld naar de branch inbox-beheer (tools/seal_build.sh); de workflow Builds zet het in de afgesloten map builds/ op
# de server van beheer.bingr.online. Nooit onversleuteld op GitHub.
# Build-rapport (fouten + staart van het log) op de branch ci-logs-beheer (latest.txt); fouten ook als annotaties.
# Privé: nooit in de changelog, geen Bingr-buildnummer.

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beheer-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Xcode-versie kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Project genereren
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iOS (generiek apparaat, zonder signing)
        id: ios
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project BingrBeheer.xcodeproj -scheme BingrBeheer \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/ios.log"

      - name: Fouten als annotaties
        if: always()
        run: |
          LOG="$RUNNER_TEMP/ios.log"
          [ -f "$LOG" ] || exit 0
          grep -E "^/.+:[0-9]+:[0-9]+: error: " "$LOG" | sort -u | head -40 | while IFS= read -r l; do
            f="${l%%:*}"; rest="${l#*:}"; line="${rest%%:*}"; msg="${l#*: error: }"
            echo "::error file=${f#$GITHUB_WORKSPACE/},line=$line::$msg"
          done
          grep -E "error:" "$LOG" | grep -vE "^/.+:[0-9]+:[0-9]+: error: " | sort -u | head -15 | while IFS= read -r l; do
            echo "::error::$l"
          done

      - name: Widget-extensie controleren
        if: steps.ios.outcome == 'success'
        run: |
          # de widgets (target BingrBeheerWidgets) horen als PlugIns/BingrBeheerWidgets.appex in de app te zitten
          if find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 4 -type d -path '*BingrBeheer.app/PlugIns/BingrBeheerWidgets.appex' | grep -q .; then
            echo "::notice::Widget-extensie ingebed in de app"
          else
            echo "::warning::BingrBeheerWidgets.appex niet gevonden in de app (widgets ontbreken)"
          fi

      - name: Build-rapport publiceren (branch ci-logs-beheer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$RUNNER_TEMP/ios.log"; touch "$LOG"
          R="$RUNNER_TEMP/report"; rm -rf "$R"; mkdir -p "$R"
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "ios: ${{ steps.ios.outcome }}"
            echo
            echo "=== errors ==="
            grep -E "error:" "$LOG" | sort -u | head -300 || true
            echo
            echo "=== warnings (Swift) ==="
            grep -E "^/.+:[0-9]+:[0-9]+: warning: " "$LOG" | sed "s#^$GITHUB_WORKSPACE/##" | sort -u | head -150 || true
          } > "$R/latest.txt"
          tail -n 300 "$LOG" > "$R/ios-tail.txt" || true
          cd "$R"
          git init -q -b ci-logs-beheer
          git add latest.txt ios-tail.txt
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "build $GITHUB_SHA ios=${{ steps.ios.outcome }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs-beheer

      - name: Xcode-project versleuteld aanleveren voor beheer.bingr.online
        if: steps.ios.outcome == 'success'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(grep -m1 'MARKETING_VERSION' ios/project.yml | grep -o '[0-9][0-9.]*' | head -1)
          B=$(grep -m1 'CURRENT_PROJECT_VERSION' ios/project.yml | grep -o '[0-9]\+' | head -1)
          Z="$RUNNER_TEMP/Bingr-Beheer-$V-build$B-Xcode.zip"
          # ios/ met het gegenereerde BingrBeheer.xcodeproj (zonder build-mappen)
          zip -qr "$Z" ios -x 'ios/build/*' 'ios/DerivedData/*' '*.DS_Store' 'ios/*.xcodeproj/xcuserdata/*' 'ios/*.xcodeproj/project.xcworkspace/xcuserdata/*'
          N="$RUNNER_TEMP/notes.md"
          {
            echo "Bingr Beheer $V (build $B): Xcode-project voor iOS/iPadOS 17+."
            echo
            echo "Uitpakken, \`ios/BingrBeheer.xcodeproj\` openen, bij Signing & Capabilities je Team kiezen en op je iPhone/iPad draaien."
            echo
            echo "Commit $(echo $GITHUB_SHA | cut -c1-7)."
          } > "$N"
          # builds.pub.pem van de nieuwste main (de workflow Builds kan hem net vernieuwd hebben)
          git fetch -q origin main && git checkout -q origin/main -- builds.pub.pem 2>/dev/null || true
          tools/seal_build.sh beheer "$Z" "$V" "$B" "$N"
          rm -f "$Z"

      - name: Status
        if: steps.ios.outcome != 'success'
        run: exit 1
