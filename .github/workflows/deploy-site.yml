name: Dashboard

# Zet het beheer-dashboard (map web/) via FTPS op de webserver, in de map waar beheer.bingr.online naar wijst.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD en optioneel FTP_DIR (de map van het subdomein; leeg = hoofdmap van de FTP-login, bv. beheer.bingr.online of
# domains/bingr.online/public_html/beheer). Optioneel: FTP_USERNAME_ALT (tweede gebruikersnaam om te proberen).
# Ontbreekt er een secret, dan alleen een waarschuwing (geen fout). Zonder FTP_DIR gaat de upload naar de hoofdmap van de FTP-login, maar nooit als dat de webmap van bingr.online is.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Controleren
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          missing=""
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do [ -n "${!k:-}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets ontbreken:$missing — dashboard niet geüpload. Zie README.md."; echo "skip=1" >> $GITHUB_OUTPUT; exit 0
          fi
          # nooit in de hoofdmap of de webmap van bingr.online uploaden: FTP_DIR moet de eigen map van het subdomein zijn
          # zonder FTP_DIR: upload naar de hoofdmap van de FTP-login (eigen FTP-account van het subdomein);
          # na het inloggen wordt gecontroleerd dat dat niet de webmap van bingr.online is
          d="${FTP_DIR%/}"; d="${d#/}"; d="${d#./}"
          [ -z "${FTP_DIR:-}" ] && d="(leeg)"
          case "$d" in
            "."|public_html|httpdocs|www|htdocs|domains/bingr.online/public_html)
              echo "::warning::FTP_DIR '$FTP_DIR' is de hoofdmap of de webmap van bingr.online, niet de map van beheer.bingr.online — niet geüpload."
              echo "skip=1" >> $GITHUB_OUTPUT ;;
          esac
          # het dashboard moet noindex houden (web/ bevat verder alleen de publieke Supabase-URL en publishable key)
          grep -q 'name="robots" content="noindex' web/index.html || { echo "::error::web/index.html mist noindex"; exit 1; }

      - name: lftp installeren
        if: steps.check.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Uploaden via FTPS
        if: steps.check.outputs.skip != '1'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USERNAME_ALT: ${{ secrets.FTP_USERNAME_ALT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set ssl:verify-certificate no; set ftp:passive-mode true"
          # eerst expliciete FTPS (versleuteld), daarna gewone FTP als de server geen TLS kent
          # spaties, tabs en regeleinden rond de secrets weghalen (komt vaak mee bij plakken)
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            v="${!k}"; t=$(trim "$v"); [ "$v" != "$t" ] && echo "::warning::$k had spaties of een regeleinde aan begin of eind; die zijn weggehaald."
            printf -v "$k" '%s' "$t"
          done
          # wachtwoord via LFTP_PASSWORD: tekens als , " \\ ; of # in het wachtwoord breken anders het lftp-commando
          export LFTP_PASSWORD="$FTP_PASSWORD"
          u="$FTP_USERNAME"
          echo "::notice::Gebruikersnaam: ${#u} tekens, eindigt op @beheer.bingr.online: $([[ "$u" == *@beheer.bingr.online ]] && echo ja || echo nee); wachtwoord: ${#FTP_PASSWORD} tekens"
          USER_OK=""; base=""; SERVER_OK=""
          # DNS-controle (alleen of de naam bestaat; de naam zelf kan gemaskeerd zijn)
          for h in "$FTP_SERVER" ftp.bingr.online; do
            ip=$( (getent ahostsv4 "$h" || true) | awk 'NR==1{print $1}'); echo "::notice::DNS ${h}: ${ip:-niet gevonden} (lengte ${#h})"
          done
          # de FTP-server reageert soms even niet: tot 4 pogingen met een pauze
          for attempt in 1 2 3 4; do
          [ "$attempt" -gt 1 ] && { echo "Nieuwe poging $attempt over 45 s…"; sleep 45; }
          for srv in "$FTP_SERVER" "ftp.bingr.online"; do
          for mode in "set ftp:ssl-force true; set ftp:ssl-protect-data true" "set ftp:ssl-allow false"; do
            for u in "$FTP_USERNAME" "${FTP_USERNAME_ALT:-}"; do
              [ -z "$u" ] && continue
              echo "Proberen: gebruiker '${u%%@*}…', modus: ${mode%%;*}"
              if lftp -e "$common; $mode; open --env-password -u \"$u\" \"$srv\"; cls -1 > /tmp/root.txt; bye" 2>/tmp/err.txt; then
                USER_OK="$u"; base="$common; $mode"; SERVER_OK="$srv"; break 4
              fi
              msg=$(sed 's/PASS .*/PASS ***/' /tmp/err.txt | tr '\n' ' ' | tail -c 300)
              echo "::warning::Mislukt (${srv}, gebruiker ${u%%@*}…, ${mode%%;*}): ${msg:-geen melding}"
            done
          done
          done
          done
          [ -n "$USER_OK" ] || { echo "::error::Inloggen op de FTP-server mislukt met de opgegeven gebruikersnamen."; exit 1; }
          [[ "$base" == *"ssl-allow false"* ]] && echo "::warning::Server ondersteunt geen FTPS; upload gaat via gewone FTP."
          echo "::notice::Ingelogd op ${SERVER_OK} als ${USER_OK%%@*}…"

          TARGET="${FTP_DIR%/}"
          if [ -z "$TARGET" ]; then
            TARGET="."
            # veiligheid: nooit het dashboard in de webmap van bingr.online zetten
            if grep -qxE '(koppelen|changelog|status|unsubscribe|account)/?' /tmp/root.txt; then
              echo "::error::Zonder FTP_DIR komt deze FTP-login uit in de webmap van bingr.online. Gebruik een eigen FTP-account voor beheer.bingr.online of zet FTP_DIR."
              exit 1
            fi
            echo "::notice::Geen FTP_DIR: upload naar de hoofdmap van de FTP-login"
          fi
          # begint de FTP-hoofdmap al in public_html (de webmap van bingr.online)? dan het voorvoegsel public_html/ weglaten,
          # anders ontstaat er een map public_html in de website
          t="${TARGET#/}"
          if [[ "$t" == public_html/* ]] && ! grep -qx 'public_html/\?' /tmp/root.txt; then
            TARGET="${t#public_html/}"
            echo "::notice::FTP-hoofdmap is al public_html; doelmap wordt $TARGET"
          fi
          # map aanmaken als hij er nog niet is (mkdir -p -f: geen fout als hij al bestaat)
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; mkdir -p -f \"$TARGET\"; bye" || true
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; mirror -R --verbose --parallel=4 --only-newer --exclude-glob .DS_Store ./web/ \"$TARGET\"; bye"
          echo "::notice::Dashboard geüpload naar map $TARGET"
          # overzicht voor controle: mappen in de FTP-hoofdmap en de inhoud van de doelmap (alleen namen)
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -1; bye" > /tmp/ls-root.txt 2>&1 || true
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -1 \"$TARGET/\"; bye" > /tmp/ls-target.txt 2>&1 || true
          echo "::notice::FTP-hoofdmap: $(tr '\n' ' ' < /tmp/ls-root.txt | sed 's#ftp://[^ ]*@#ftp://***@#g' | head -c 600)"
          echo "::notice::Inhoud doelmap: $(tr '\n' ' ' < /tmp/ls-target.txt | head -c 400)"
          # rechten: map 755 en bestanden 644, anders geeft de webserver 403
          # (los van elkaar: de hoofdmap van een FTP-login mag vaak niet ge-chmod worden)
          [ "$TARGET" != "." ] && { lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; chmod 755 \"$TARGET\"; bye" >/dev/null 2>&1 || echo "::warning::chmod van de doelmap niet gelukt"; }
          lftp -e "set cmd:fail-exit false; $base; set cmd:fail-exit false; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cd \"$TARGET\"; chmod 644 index.html admin.css admin.js config.js favicon.png apple-touch-icon.png robots.txt .htaccess; bye" >/tmp/chmod.txt 2>&1 || true
          echo "::notice::chmod bestanden: $(tr '\n' ' ' < /tmp/chmod.txt | head -c 300)"
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; ls -la \"$TARGET/\"; bye" 2>&1 | awk '{print $1, $NF}' | tr '\n' ' ' > /tmp/ls-la.txt || true
          echo "::notice::ls -la doelmap: $(head -c 600 /tmp/ls-la.txt)"
          if [ "$TARGET" != "." ]; then
            parent=$(dirname "$TARGET"); name=$(basename "$TARGET")
            lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -l \"$parent/\"; bye" 2>&1 | grep -v -E 'index|\.(html|css|js|png|txt|xml|json)$' | awk '{print $1, $NF}' | tr '\n' ' ' > /tmp/ls-parent.txt || true
            echo "::notice::Mappen naast de doelmap: $(sed "s#$name#<FTP_DIR-map>#g" /tmp/ls-parent.txt | head -c 900)"
          fi
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cls -l \"$TARGET/\"; bye" 2>&1 | awk '{print $1, $NF}' | sed 's#.*/##' | tr '\n' ' ' > /tmp/ls-perm.txt || true
          echo "::notice::Rechten doelmap: $(head -c 500 /tmp/ls-perm.txt)"
          # waar is de doelmap via de website bereikbaar? (laat zien of de FTP-hoofdmap de webmap van bingr.online is)
          for u in "https://bingr.online/${TARGET#/}/robots.txt" "https://bingr.online/public_html/robots.txt"; do
            echo "::notice::Test $(echo "$u" | sed "s#${TARGET#/}#<FTP_DIR>#"): $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' --max-time 15 "$u")"
          done
          if [ "$SERVER_OK" != "$FTP_SERVER" ]; then echo "::warning::FTP_SERVER werkt niet (naam onbekend); gebruik ftp.bingr.online als waarde."; fi

      - name: Controleren of beheer.bingr.online het dashboard toont
        if: steps.check.outputs.skip != '1' && success()
        run: |
          sleep 5
          url=https://beheer.bingr.online/
          code=$(curl -sL --max-time 20 -o /tmp/site.html -w '%{http_code}' "$url" || true)
          if grep -q 'name="bingr-app" content="beheer"' /tmp/site.html 2>/dev/null; then
            echo "::notice::$url toont het dashboard (HTTP $code)"
            robots=$(curl -sL --max-time 20 "${url}robots.txt" || true)
            echo "$robots" | grep -q 'Disallow: /$' && echo "::notice::robots.txt blokkeert alles" || echo "::warning::robots.txt op $url blokkeert niet alles"
          else
            ip=$(getent hosts beheer.bingr.online | awk '{print $1}' | head -1)
            if [ -z "$ip" ]; then
              echo "::warning::beheer.bingr.online bestaat nog niet in DNS: maak het subdomein aan bij de hoster (zie README.md)."
            else
              for u in https://beheer.bingr.online/ https://beheer.bingr.online/index.html https://beheer.bingr.online/robots.txt http://beheer.bingr.online/; do
                r=$(curl -skI --max-time 15 "$u" | tr -d '\r' | grep -iE '^(HTTP|server|location)' | tr '\n' ' ')
                echo "::notice::$u -> ${r:-geen antwoord}"
              done
              cert=$(echo | openssl s_client -connect beheer.bingr.online:443 -servername beheer.bingr.online 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ')
              echo "::notice::Certificaat: ${cert:-geen}"
              echo "::warning::$url ($ip) geeft HTTP ${code:-geen antwoord}, nog niet het dashboard: wijst het subdomein naar FTP_DIR, en is er een SSL-certificaat? $(head -c 160 /tmp/site.html 2>/dev/null | tr '\n' ' ')"
            fi
          fi
