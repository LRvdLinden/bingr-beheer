name: Dashboard

# Zet het beheer-dashboard (map web/) via FTPS op de webserver, in de map waar beheer.bingr.online naar wijst.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD en optioneel FTP_DIR (de map van het subdomein; leeg = hoofdmap van de FTP-login, bv. beheer.bingr.online of
# domains/bingr.online/public_html/beheer). Optioneel: FTP_USERNAME_ALT (tweede gebruikersnaam om te proberen).
# build 95: alleen FTPS met gecontroleerd certificaat op FTP_SERVER (geen gewone FTP, geen andere server); het log is openbaar.
# Ontbreekt er een secret, dan alleen een waarschuwing (geen fout). Zonder FTP_DIR gaat de upload naar de hoofdmap van de FTP-login, maar nooit als dat de webmap van bingr.online is.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Controleren
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          missing=""
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do [ -n "${!k:-}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets ontbreken:$missing — dashboard niet geüpload. Zie README.md."; echo "skip=1" >> $GITHUB_OUTPUT; exit 0
          fi
          # nooit in de hoofdmap of de webmap van bingr.online uploaden: FTP_DIR moet de eigen map van het subdomein zijn
          # zonder FTP_DIR: upload naar de hoofdmap van de FTP-login (eigen FTP-account van het subdomein);
          # na het inloggen wordt gecontroleerd dat dat niet de webmap van bingr.online is
          d="${FTP_DIR%/}"; d="${d#/}"; d="${d#./}"
          [ -z "${FTP_DIR:-}" ] && d="(leeg)"
          case "$d" in
            "."|public_html|httpdocs|www|htdocs|domains/bingr.online/public_html)
              echo "::warning::FTP_DIR is de hoofdmap of de webmap van bingr.online, niet de map van beheer.bingr.online — niet geüpload."
              echo "skip=1" >> $GITHUB_OUTPUT ;;
          esac
          # het dashboard moet noindex houden (web/ bevat verder alleen de publieke Supabase-URL en publishable key)
          grep -q 'name="robots" content="noindex' web/index.html || { echo "::error::web/index.html mist noindex"; exit 1; }

      - name: lftp installeren
        if: steps.check.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Uploaden via FTPS
        if: steps.check.outputs.skip != '1'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USERNAME_ALT: ${{ secrets.FTP_USERNAME_ALT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          # build 95: alleen nog FTPS met een gecontroleerd certificaat (geen terugval naar gewone FTP, geen tweede server).
          # Het log is openbaar: geen gebruikersnamen, mappen, IP-adressen of certificaatgegevens, alleen gelukt/mislukt.
          common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set ftp:passive-mode true"
          common="$common; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:ssl-protect-list true"
          common="$common; set ssl:verify-certificate yes; set ssl:check-hostname yes; set ssl:ca-file /tmp/ftp-ca.pem"
          # spaties, tabs en regeleinden rond de secrets weghalen (komt vaak mee bij plakken)
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            v="${!k}"; t=$(trim "$v"); [ "$v" != "$t" ] && echo "::warning::$k had spaties of een regeleinde aan begin of eind; die zijn weggehaald."
            printf -v "$k" '%s' "$t"
          done
          # wachtwoord via LFTP_PASSWORD: tekens als , " \\ ; of # in het wachtwoord breken anders het lftp-commando
          export LFTP_PASSWORD="$FTP_PASSWORD"

          # soort fout uit de lftp-melding halen (de melding zelf komt niet in het log)
          classify(){
            if grep -qiE "doesn.?t match|does not match|not match.*host|hostname mismatch" /tmp/err.txt; then echo hostname
            elif grep -qiE "certificate|verif|gnutls|ssl|tls" /tmp/err.txt; then echo tls
            elif grep -qiE "login incorrect|530|authentication|not logged in" /tmp/err.txt; then echo login
            else echo connect; fi
          }
          # inloggen (FTPS, certificaat gecontroleerd); bij succes staat de hoofdmap (alleen namen) in /tmp/root.txt
          try_login(){ lftp -e "$common; open --env-password -u \"$2\" \"$1\"; cls -1 > /tmp/root.txt; bye" >/dev/null 2>/tmp/err.txt; }
          ips(){ (getent ahosts "$1" || true) | awk '{print $1}' | sort -u; }
          # build 95: onvolledige keten (tussencertificaat niet meegestuurd): via het AIA-adres in het certificaat ophalen en
          # naast de standaard root-certificaten zetten; de controle tegen een vertrouwde root blijft volledig
          CA=/tmp/ftp-ca.pem; cp /etc/ssl/certs/ca-certificates.crt "$CA"
          add_chain(){
            local h="$1" aia
            aia=$(timeout 30 openssl s_client -connect "$h:21" -starttls ftp -servername "$h" </dev/null 2>/dev/null \
              | openssl x509 -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://' | head -1 || true)
            [ -n "$aia" ] || return 0
            curl -fsSL --max-time 20 "$aia" -o /tmp/inter.bin 2>/dev/null || return 0
            openssl x509 -inform DER -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || openssl x509 -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || return 0
            grep -q "$(sed -n 2p /tmp/inter.pem)" "$CA" || cat /tmp/inter.pem >> "$CA"
          }

          # Gedeelde hosting toont vaak een certificaat op naam van de hoster. Mislukt de controle alleen op de hostnaam,
          # dan een naam uit het certificaat (SAN/CN, geen wildcard; bij een wildcard afgeleid van FTP_SERVER) die naar
          # hetzelfde IP-adres wijst als FTP_SERVER. Die wordt daarna net zo goed volledig gecontroleerd.
          cert_host(){
            local host="$1" names n want got cand=""
            names=$(timeout 25 openssl s_client -connect "$host:21" -starttls ftp -servername "$host" </dev/null 2>/dev/null \
              | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null \
              | grep -oE '(DNS:|CN ?= ?)[A-Za-z0-9*._-]+' | sed -E 's/^(DNS:|CN ?= ?)//' | tr 'A-Z' 'a-z' | sort -u) || true
            want=$(ips "$host"); [ -n "$want" ] || return 1
            # build 95: ook de naam uit de reverse DNS (de echte servernaam onder het wildcard-certificaat van de hoster)
            local ptr; ptr=$(getent hosts "$(echo "$want" | head -1)" 2>/dev/null | awk '{print $2}' | sed 's/\.$//' | tr 'A-Z' 'a-z' || true)
            for n in $ptr $names; do
              if [[ "$n" == \*.* ]]; then n="${host%%.*}.${n#\*.}"; fi
              [[ "$n" == *\** || "$n" == "$host" ]] && continue
              got=$(ips "$n"); [ -n "$got" ] || continue
              # alle adressen van de naam uit het certificaat moeten ook adressen van FTP_SERVER zijn
              if [ -z "$(comm -23 <(echo "$got") <(echo "$want"))" ]; then cand="$n"; break; fi
            done
            [ -n "$cand" ] && { printf '%s' "$cand"; return 0; }
            return 1
          }

          USER_OK=""; SERVER_OK=""; last=""
          # de FTP-server reageert soms even niet: tot 4 pogingen met een pauze (alleen bij verbindingsfouten)
          for attempt in 1 2 3 4; do
            [ "$attempt" -gt 1 ] && { echo "Nieuwe poging $attempt over 45 s…"; sleep 45; }
            # FTP_SERVER, anders ftp.bingr.online of bingr.online (zoals vroeger); alleen namen die bestaan, en lftp
            # controleert het certificaat vóór er inloggegevens gaan (ftp:ssl-force + ssl:verify-certificate)
            for base in "$FTP_SERVER" ftp.bingr.online bingr.online; do
            [ -n "$(ips "$base")" ] || { [ "$base" = "$FTP_SERVER" ] && [ "$attempt" = 1 ] && echo "::warning::FTP_SERVER bestaat niet in DNS; ftp.bingr.online wordt geprobeerd."; continue; }
            srv="$base"; [ "$attempt" = 1 ] && add_chain "$base"
            for u in "$FTP_USERNAME" "${FTP_USERNAME_ALT:-}"; do
              [ -z "$u" ] && continue
              if try_login "$srv" "$u"; then USER_OK="$u"; SERVER_OK="$srv"; break 3; fi
              last=$(classify)
              if [ "$last" = hostname ] || [ "$last" = tls ]; then
                if alt=$(cert_host "$base"); then
                  echo "::notice::Certificaat staat op een andere hostnaam van dezelfde server; die wordt gebruikt (met controle)."
                  srv="$alt"
                  if try_login "$srv" "$u"; then USER_OK="$u"; SERVER_OK="$srv"; break 3; fi
                  last=$(classify)
                fi
              fi
              case "$last" in
                hostname|tls) break ;;
                login) echo "::warning::Inloggen geweigerd met een van de opgegeven gebruikersnamen." ;;
                *) echo "::warning::Geen verbinding met de FTP-server (poging $attempt)." ;;
              esac
            done
            [ "$last" = login ] && break 2
            done
            [ "$last" = hostname ] || [ "$last" = tls ] && break
          done
          rm -f /tmp/err.txt
          if [ -z "$USER_OK" ]; then
            case "$last" in
              hostname) echo "::error::Het TLS-certificaat van de FTP-server staat niet op de naam in FTP_SERVER, en geen naam uit het certificaat wijst naar dezelfde server. Zet het secret FTP_SERVER op de hostnaam die op het certificaat staat (vraag die zo nodig na bij de hoster)." ;;
              tls) echo "::error::Het TLS-certificaat van de FTP-server kon niet worden gecontroleerd (verlopen, zelf ondertekend of geen FTPS). Zet FTP_SERVER op de hostnaam die op het certificaat staat, of vraag de hoster om een geldig certificaat. Gewone FTP wordt niet meer gebruikt." ;;
              login) echo "::error::Inloggen op de FTP-server mislukt: controleer FTP_USERNAME en FTP_PASSWORD." ;;
              *) echo "::error::Geen verbinding met de FTP-server: controleer FTP_SERVER." ;;
            esac
            exit 1
          fi
          echo "::notice::Ingelogd op de FTP-server (FTPS, certificaat gecontroleerd)."
          base="$common"
          run(){ lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; $1; bye"; }

          TARGET="${FTP_DIR%/}"
          if [ -z "$TARGET" ]; then
            TARGET="."
            # veiligheid: nooit het dashboard in de webmap van bingr.online zetten
            if grep -qxE '(koppelen|changelog|status|unsubscribe|account)/?' /tmp/root.txt; then
              echo "::error::Zonder FTP_DIR komt deze FTP-login uit in de webmap van bingr.online. Gebruik een eigen FTP-account voor beheer.bingr.online of zet FTP_DIR."
              exit 1
            fi
            echo "::notice::Geen FTP_DIR: upload naar de hoofdmap van de FTP-login"
          fi
          # begint de FTP-hoofdmap al in public_html (de webmap van bingr.online)? dan het voorvoegsel public_html/ weglaten,
          # anders ontstaat er een map public_html in de website
          t="${TARGET#/}"
          if [[ "$t" == public_html/* ]] && ! grep -qx 'public_html/\?' /tmp/root.txt; then
            TARGET="${t#public_html/}"
            echo "::notice::FTP-hoofdmap is al public_html; het voorvoegsel public_html/ is weggelaten."
          fi
          rm -f /tmp/root.txt
          # map aanmaken als hij er nog niet is (mkdir -p -f: geen fout als hij al bestaat)
          run "mkdir -p -f \"$TARGET\"" >/dev/null 2>&1 || true
          run "mirror -R --parallel=4 --only-newer --exclude-glob .DS_Store ./web/ \"$TARGET\"" >/dev/null 2>&1 \
            || { echo "::error::Uploaden naar de FTP-server mislukt."; exit 1; }
          echo "::notice::Dashboard geüpload."
          # rechten: map 755 en bestanden 644, anders geeft de webserver 403
          # (los van elkaar: de hoofdmap van een FTP-login mag vaak niet ge-chmod worden)
          [ "$TARGET" != "." ] && { run "chmod 755 \"$TARGET\"" >/dev/null 2>&1 || echo "::warning::chmod van de doelmap niet gelukt"; }
          lftp -e "set cmd:fail-exit false; $base; set cmd:fail-exit false; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cd \"$TARGET\"; chmod 644 index.html admin.css admin.js config.js favicon.png apple-touch-icon.png robots.txt .htaccess dl.php; chmod 755 builds; chmod 644 builds/.htaccess; bye" >/dev/null 2>&1 \
            && echo "::notice::Rechten van de bestanden gezet." || echo "::warning::Rechten van de bestanden niet (allemaal) gezet."

      - name: Controleren of beheer.bingr.online het dashboard toont
        if: steps.check.outputs.skip != '1' && success()
        run: |
          sleep 5
          url=https://beheer.bingr.online/
          code=$(curl -sL --max-time 20 -o /tmp/site.html -w '%{http_code}' "$url" || true)
          if grep -q 'name="bingr-app" content="beheer"' /tmp/site.html 2>/dev/null; then
            echo "::notice::$url toont het dashboard (HTTP $code)"
            # downloads: dl.php moet draaien (PHP) en de map builds/ mag nooit rechtstreeks bereikbaar zijn
            ping=$(curl -s --max-time 20 "${url}dl.php?ping=1" || true)
            echo "$ping" | grep -q '"ok":true' && echo "::notice::dl.php werkt ($(echo "$ping" | grep -o '"ready":[a-z]*'))" \
              || echo "::warning::dl.php geeft geen goed antwoord: draait PHP op beheer.bingr.online?"
            for f in builds/ builds/.htaccess builds/manifest.json builds/key.php; do
              c=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "${url}$f" || true)
              case "$c" in 200) echo "::error::${url}$f is rechtstreeks bereikbaar (HTTP 200)"; exit 1 ;; esac
            done
            echo "::notice::Map builds/ is afgesloten"
            robots=$(curl -sL --max-time 20 "${url}robots.txt" || true)
            echo "$robots" | grep -q 'Disallow: /$' && echo "::notice::robots.txt blokkeert alles" || echo "::warning::robots.txt op $url blokkeert niet alles"
          else
            # build 95: geen IP-adressen, serverkoppen of certificaatgegevens in het (openbare) log
            if ! getent hosts beheer.bingr.online >/dev/null; then
              echo "::warning::beheer.bingr.online bestaat nog niet in DNS: maak het subdomein aan bij de hoster (zie README.md)."
            else
              echo "::warning::$url geeft HTTP ${code:-geen antwoord}, nog niet het dashboard: wijst het subdomein naar FTP_DIR, en is er een SSL-certificaat?"
            fi
          fi
